name: Build Windows exe
on:
  workflow_dispatch:
  push:
jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - run: python -m PyInstaller --noconfirm --onefile --windowed --name MyceliumBase --add-data "index.html;." launch.py
      - uses: actions/upload-artifact@v4
        with:
          name: MyceliumBase-windows
          path: dist/MyceliumBase.exe
