<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Mycelium Base</title>
<style>
:root{--edge:#20413d;--teal:#7fe0b8;--gold:#ffd27a;--coral:#ff8a7a;--violet:#b08cff;--txt:#e6fff6;--dim:#8fb3aa}
*{box-sizing:border-box}
body{margin:0;background:radial-gradient(1200px 700px at 40% 20%,#183230 0%,#0a1212 60%,#050707 100%);color:var(--txt);font:13px/1.25 system-ui,"Segoe UI",sans-serif;min-height:100vh}
#wrap{display:flex;gap:14px;padding:14px;justify-content:center;align-items:flex-start}
#map{width:880px;position:relative}
#hud{display:flex;gap:10px;align-items:center;padding:8px 10px;background:linear-gradient(#17302d,#0c1918);border:1px solid var(--edge);border-radius:14px;box-shadow:0 6px 18px #0009,inset 0 1px 0 #ffffff12;margin-bottom:10px}
.pill{display:flex;align-items:center;gap:6px;font-weight:800;font-size:14px;background:#0a1514;border:1px solid #1d3a36;border-radius:20px;padding:4px 10px}
.stagename{color:var(--teal);font-size:12px;letter-spacing:.6px;text-transform:uppercase;font-weight:700}
.grow{flex:1}
.meter{display:inline-block;width:86px;height:9px;background:#0a1110;border-radius:6px;overflow:hidden;box-shadow:inset 0 1px 3px #000;border:1px solid #1d3a36}
.meter i{display:block;height:100%;border-radius:6px;transition:width .25s;background:linear-gradient(90deg,#ff8a7a,#ffb8a8)}
#hb{background:linear-gradient(90deg,#7fe0b8,#bff5e6)}
#nb{background:linear-gradient(90deg,#b08cff,#e0a0ff)}
#stage{position:relative;border-radius:14px;overflow:hidden;box-shadow:0 0 0 1px var(--edge),0 10px 30px #000a}
canvas{display:block;width:880px;height:600px}
#msg{position:absolute;left:50%;top:14px;transform:translateX(-50%);background:#081211e6;border:1px solid var(--teal);color:var(--teal);border-radius:18px;padding:5px 14px;font-weight:700;pointer-events:none;opacity:0;transition:opacity .25s;white-space:nowrap}
#side{width:330px;display:flex;flex-direction:column;gap:10px}
.panel{background:linear-gradient(#112523,#0a1514);border:1px solid var(--edge);border-radius:14px;padding:10px;box-shadow:0 6px 16px #0007}
.ph{font-size:11px;letter-spacing:1.5px;text-transform:uppercase;color:var(--teal);margin-bottom:8px;font-weight:800}
.grid3,.grid4,.grid5{display:grid;gap:8px}
.grid3{grid-template-columns:repeat(3,1fr)}.grid4{grid-template-columns:repeat(4,1fr)}.grid5{grid-template-columns:repeat(5,1fr)}
.ib{position:relative;display:flex;align-items:center;justify-content:center;gap:4px;height:72px;padding:0;background:linear-gradient(#1a3834,#0f2320);border:1px solid #2a524c;border-radius:12px;cursor:pointer;color:var(--txt);transition:transform .08s,box-shadow .15s,border-color .15s,filter .15s;box-shadow:inset 0 1px 0 #ffffff14,0 3px 8px #0006}
.ib:hover{border-color:var(--teal);box-shadow:0 0 14px #7fe0b855,inset 0 1px 0 #ffffff1c;transform:translateY(-1px)}
.ib:active{transform:translateY(1px)}
.ib.on{border-color:var(--gold);box-shadow:0 0 16px #ffd27a66,inset 0 0 12px #ffd27a33}
.ib.no{filter:grayscale(.85) brightness(.7)}
.ib.locked{filter:grayscale(1) brightness(.5)}
.ib canvas{display:block}
.tb{width:46px;height:40px}
.lbl{font-weight:800;font-size:12px}
.badge{position:absolute;right:-6px;bottom:-7px;display:flex;align-items:center;gap:2px;background:#15140c;border:1px solid var(--gold);color:var(--gold);border-radius:9px;padding:1px 5px 1px 3px;font-size:11px;font-weight:800;box-shadow:0 2px 6px #000a}
.cd{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font-weight:900;font-size:20px;color:#fff;text-shadow:0 2px 4px #000;background:#0008;border-radius:12px}
.cd:empty{display:none}
.dot{position:absolute;left:6px;top:6px;width:8px;height:8px;border-radius:50%;background:#4a5f5c}
.dot.idle{background:#7fe0b8;box-shadow:0 0 6px #7fe0b8}.dot.busy{background:#ffd27a;box-shadow:0 0 6px #ffd27a}
.dot.hunt,.dot.strike{background:#9fffe6;box-shadow:0 0 6px #9fffe6}.dot.deploy,.dot.ret{background:#8fb3aa}
.lk{position:absolute;right:4px;top:4px;display:none}
.scard.locked .lk{display:block}
.num{position:absolute;left:6px;top:4px;font-weight:900;color:var(--gold);font-size:12px}
.seltop{display:flex;gap:10px;align-items:center;margin-bottom:8px}
.pips i{display:inline-block;width:10px;height:10px;border-radius:50%;background:#1d3a36;margin-right:4px;border:1px solid #2a524c}
.pips i.on{background:var(--gold);border-color:var(--gold);box-shadow:0 0 6px #ffd27a}
.chips{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:8px}
.chip{display:flex;align-items:center;gap:4px;background:#0a1514;border:1px solid #1d3a36;border-radius:10px;padding:3px 8px;font-weight:800}
.tag{background:#2b1f48;color:var(--violet);border:1px solid #4a3a7a;border-radius:10px;padding:2px 8px;font-size:11px;font-weight:700}
.acts{display:flex;gap:8px}
.ubtn{flex:1;height:52px}.sbtn{width:86px;height:52px}
.meter.sm{width:100%;height:6px;margin-bottom:4px}
.dim{color:var(--dim)}
#tip{position:fixed;pointer-events:none;background:#081211f5;border:1px solid var(--teal);border-radius:10px;padding:8px 10px;max-width:250px;display:none;z-index:9;box-shadow:0 8px 20px #000c}
#tip b{color:var(--gold);display:block;margin-bottom:3px}
</style></head><body>
<div id="wrap">
 <div id="map">
  <div id="hud">
   <div class="pill"><span id="i-coin"></span><b id="sp"></b></div>
   <div class="pill"><span id="i-hp"></span><span class="meter"><i id="hb"></i></span><b id="hp"></b></div>
   <div class="pill"><span id="i-nest"></span><span class="meter"><i id="nb"></i></span><b id="nh"></b></div>
   <div class="pill"><span id="i-wave"></span><b id="wv"></b></div>
   <span class="stagename" id="sn"></span>
   <span class="grow"></span>
   <button id="call" class="ib tb"></button><button id="spd" class="ib tb"></button><button id="pz" class="ib tb"></button>
  </div>
  <div id="stage"><canvas id="c" width="880" height="600"></canvas><div id="msg"></div></div>
 </div>
 <div id="side">
  <div class="panel"><div class="ph">Towers</div><div class="grid3" id="tw"></div></div>
  <div class="panel"><div class="ph">Troops</div><div class="grid5" id="tr"></div></div>
  <div class="panel"><div class="ph">Stages</div><div class="grid4" id="stg"></div></div>
  <div class="panel"><div class="ph">Selected</div><div id="sel"><div class="dim">Click a tower to upgrade or sell it</div></div></div>
 </div>
</div>
<div id="tip"></div>

const nearestTower=(x,y)=>{let b=null,bd=1e9;for(const t of S.tw){const d=hyp(x,y,t.x,t.y);if(d<bd){bd=d;b=t;}}return b;};
const slimeNear=(x,y)=>S.fx.some(f=>f.k==='slime'&&hyp(f.x,f.y,x,y)<.7);
const moveTo=(o,tx,ty,s)=>{const dx=tx-o.x,dy=ty-o.y,d=Math.hypot(dx,dy);if(d<=s){o.x=tx;o.y=ty;return true;}o.x+=dx/d*s;o.y+=dy/d*s;return false;};
function hit(e,dmg,src){
  if(e.dead)return;if(e.rf>0&&S.thorn)dmg*=1.5;e.fl=.08;const T=EN[e.k];
  if(e.sh>0){e.sh-=Math.max(dmg*.25,dmg-(T.shar||0));return;}
  e.hp-=Math.max(dmg*.25,dmg-T.ar);if(e.hp<=0)kill(e,src);
}
function kill(e,src){
  e.dead=1;S.sp+=EN[e.k].rw;burst(e.x,e.y,'#9fffe6',12);
  if(e.k==='snail')S.en.push({k:'slug',d:e.d,x:e.x,y:e.y,hp:45,max:45,sh:0,shm:0,ph:0,fl:0,sl:0,sf:1,rf:0,dead:0,fire:0,stm:0,rv:0,tox:0});
  if(src&&src.k==='spore'&&st(src).x.has('bloom')){for(const o of S.en)if(!o.dead&&!o.bur&&hyp(o.x,o.y,e.x,e.y)<=1)hit(o,6,null);S.fx.push({k:'ring',x:e.x,y:e.y,r:1,t:.35,T:.35,c:'154,106,224'});}
}
function burst(x,y,c,n){for(let i=0;i<n;i++)S.fx.push({k:'p',x,y,ox:0,oy:0,vx:(Math.random()-.5)*140,vy:(Math.random()-.9)*140,t:.6,c});}

function mkWave(w){const q=[],a=(k,n)=>{for(let i=0;i<n;i++)q.push(k);};a('gnat',4+w*2);if(w>=2){a('springtail',w-1);a('slug',Math.ceil(w/3));}if(w>=3){a('isopod',Math.floor((w-1)/2));if(w%2)a('worm',1+Math.floor(w/4));}if(w>=4&&!(w%2))a('millipede',Math.floor(w/3));if(w>=5)a('snail',Math.floor(w/4));return q.sort(()=>Math.random()-.5);}
function callWave(){if(S.over||S.q.length||S.en.length||S.w>=MAXW)return;S.w++;S.q=mkWave(S.w);if(STAGES[stage].boss&&S.w===MAXW)S.q.unshift('boss');S.qt=.3;S.nx=20;say('Wave '+S.w+' is leaving the Burrow.');}
function spawn(k){
  const m=1+.12*(S.w-1),T=EN[k];
  if(k==='worm'){const side=Math.random()<.5;S.en.push({k,x:side?-.5:Math.random()*GW,y:side?Math.random()*GH:-.5,bur:1,rv:0,tg:null,hd:0,hp:T.hp*m,max:T.hp*m,sp:T.sp,ph:Math.random()*6,fl:0,sl:0,sf:1,rf:0,dead:0,tox:0});return;}
  const[x,y]=at(0);S.en.push({k,d:0,x,y,hp:T.hp*m,max:T.hp*m,sh:(T.sh||0)*m,shm:(T.sh||0)*m,ph:Math.random()*6,fl:0,sl:0,sf:1,rf:0,dead:0,fire:0,stm:0,rv:0,tox:0});
  S.fx.push({k:'ring',x,y,r:.6,t:.3,T:.3,c:'127,245,224'});
}
function pushEn(k,d){const[x,y]=at(d),T=EN[k];S.en.push({k,d,x,y,hp:T.hp,max:T.hp,sh:0,shm:0,ph:Math.random()*6,fl:0,sl:0,sf:1,rf:0,dead:0,fire:0,stm:0,rv:0,tox:0});}
function deploy(k){
  const T=TR[k];if(S.over)return;
  if(S.sp<T.c){say('Need '+T.c+' spores.');return;}
  if(S.cdt[k]>0)return;
  if(k==='cicada'){if(S.cic){say('Cicada already in the field.');return;}S.sp-=T.c;S.cdt[k]=T.cd;S.cic={x:BASE[0],y:BASE[1],hp:60,kills:0,m:'deploy',st:0,tg:null,ph:0,hd:0};say('Cicada heading to its station mid-map.');return;}
  if(T.lim&&S.tr.some(t=>t.k===k)){say(T.nm+' already in the field.');return;}
  S.sp-=T.c;S.cdt[k]=T.cd;
  S.tr.push({k,d:TOT-.2,x:0,y:0,hp:T.hp,max:T.hp,fl:0,ph:Math.random()*6,bt:0,atk:0});
  say(T.nm+' marching to the Enemy Burrow.');
}

function update(dt){
  S.t+=dt;S.sp+=2*dt;S.ml=Math.max(0,S.ml-dt);
  for(const k in S.cdt)S.cdt[k]=Math.max(0,S.cdt[k]-dt);
  if(S.q.length){S.qt-=dt;if(S.qt<=0){spawn(S.q.shift());S.qt=.7;}}
  const idle=!S.q.length&&!S.en.length;
  if(!idle)S.act=1;else if(S.act){S.act=0;S.nx=20;}
  if(idle&&S.w<MAXW){S.nx-=dt;if(S.nx<=0)callWave();}
  S.thorn=S.tw.some(t=>t.k==='root'&&st(t).x.has('thorn'));
  S.pulse=S.tw.some(t=>t.k==='glow'&&st(t).x.has('pulse'));
  for(const t of S.tw){
    t.bf=1;t.bd=1;
    for(const o of S.tw)if(o.k==='glow'&&hyp(o.x,o.y,t.x,t.y)<=st(o).r){const b=st(o).bo;t.bf=Math.max(t.bf,1+b);t.bd=Math.max(t.bd,1+b);}
  }
  for(const e of S.en){
    if(e.dead||e.bur)continue;
    const T=EN[e.k];
    e.ph+=dt*6;e.fl=Math.max(0,e.fl-dt);e.sl=Math.max(0,e.sl-dt);e.rf=Math.max(0,e.rf-dt);
    if(e.k==='boss'){e.bt=(e.bt??6)-dt;if(e.bt<=0){e.bt=6;pushEn('springtail',e.d);pushEn('gnat',e.d);}}
    if(e.tox>0){e.tox-=dt;hit(e,2*dt,null);}
    if(T.slime){e.stm-=dt;if(e.stm<=0){e.stm=1.5;S.fx.push({k:'slime',x:e.x,y:e.y,t:4});}}
    let blk=null;for(const t of S.tr)if(t.hp>0&&TR[t.k].blk&&t.d>e.d&&t.d-e.d<.55){blk=t;break;}
    if(blk){blk.hp-=e.dps*dt;blk.fl=.05;}
    else if(e.rf<=0){
      const tg=T.rng?nearT(e,T.rng):null;
      if(tg){e.fire-=dt;if(e.fire<=0){e.fire=2;S.pr.push({k:'f',x:e.x,y:e.y,tg,dmg:8,t:0});}}
      else e.d+=T.sp*(e.sl>0?e.sf:1)*dt;
    }
    [e.x,e.y]=at(e.d);
    if(e.d>=TOT){e.dead=1;S.hp-=T.slime?3:1;burst(e.x,e.y,'#ff8a7a',8);}
  }
  for(const e of S.en){
    if(!e.bur||e.dead)continue;
    e.ph+=dt*5;e.rv=Math.max(0,e.rv-dt);
    if(!e.tg||e.tg.hp<=0)e.tg=nearestTower(e.x,e.y);
    const tx=e.tg?e.tg.x:BASE[0],ty=e.tg?e.tg.y:BASE[1],dd=hyp(e.x,e.y,tx,ty);
    e.hd=sA(tx-e.x,ty-e.y);
    if(dd<.4){e.dead=1;if(e.tg)e.tg.hp-=60;else S.hp-=2;burst(e.x,e.y,'#e8c890',14);}
    else{e.x+=(tx-e.x)/dd*e.sp*dt;e.y+=(ty-e.y)/dd*e.sp*dt;}
  }
  for(const t of S.tr){
    if(t.hp<=0)continue;
    [t.x,t.y]=at(t.d);
    const T=TR[t.k],sl=slimeNear(t.x,t.y)?.5:1;
    const hs=S.tw.some(m=>m.k==='mend'&&st(m).x.has('hasten')&&hyp(t.x,t.y,m.x,m.y)<=st(m).r);
    const spd=T.sp*sl*(hs?1.3:1)*(S.pulse?1.2:1);
    t.ph+=dt*8;t.fl=Math.max(0,t.fl-dt);t.bt=Math.max(0,t.bt-dt);
    let near=null,bd=1e9;
    for(const e of S.en){if(e.dead||e.bur)continue;const df=t.d-e.d;if(df>0&&df<=(T.rng||.55)&&df<bd){bd=df;near=e;}}
    if(t.k==='fly'){if(near&&bd<=.3){near.sl=.2;near.sf=.5;t.hp-=near.dps*.5*dt;}else t.d=Math.max(.25,t.d-spd*dt);}
    else if(near){
      hit(near,T.dps*dt,null);
      if(t.k==='spider'){near.sl=.2;near.sf=.4;if(t.bt<=0){t.bt=.4;S.fx.push({k:'beam',x1:t.x,y1:t.y,x2:near.x,y2:near.y,t:.15,c:'#d7e7ff'});}}
    }
    else if(t.d<=.25){S.nest.hp-=(t.k==='ant'||t.k==='moth'?T.dps:0)*dt;t.atk=1;}
    else t.d=Math.max(.25,t.d-spd*dt);
  }
  const c=S.cic;
  if(c){
    c.ph+=dt*8;
    for(const e of S.en)if(!e.dead&&!e.bur&&hyp(e.x,e.y,c.x,c.y)<.8)c.hp-=3*dt;
    if(c.hp<=0){burst(c.x,c.y,'#e8c890',12);S.cic=null;}
    else{
      if(c.m==='deploy'||c.m==='ret'){if(moveTo(c,STN[0],STN[1],3*dt))c.m='idle';}
      if(c.m==='idle'){const w=S.en.find(e=>e.bur&&!e.dead);if(w){c.tg=w;c.m='hunt';}}
      if(c.m==='hunt'){if(!c.tg||c.tg.dead)c.m='ret';else{c.hd=sA(c.tg.x-c.x,c.tg.y-c.y);if(moveTo(c,c.tg.x,c.tg.y,4*dt)){c.m='strike';c.st=.35;}}}
      if(c.m==='strike'){c.st-=dt;if(c.st<=0){if(c.tg&&!c.tg.dead){c.tg.dead=1;burst(c.tg.x,c.tg.y,'#ffe08a',14);c.kills++;}c.tg=null;if(c.kills>=2){burst(c.x,c.y,'#e8c890',12);S.cic=null;}else c.m='ret';}}
    }
  }
  for(const t of S.tw){
    t.ph+=dt;t.cd=Math.max(0,t.cd-dt*t.bf);
    const s=st(t);
    if(t.k==='glow'){for(const e of S.en)if(e.bur&&!e.dead&&hyp(e.x,e.y,t.x,t.y)<=s.r)e.rv=2;continue;}
    if(t.k==='mend'){
      t.hp=Math.min(t.max,t.hp+2*dt);for(const o of S.tw)if(o!==t&&o.k==='mend'&&hyp(o.x,o.y,t.x,t.y)<=s.r)o.hp=Math.min(o.max,o.hp+s.hl*dt);
      for(const f of S.tr)if(f.hp>0&&hyp(f.x,f.y,t.x,t.y)<=s.r)f.hp=Math.min(f.max,f.hp+s.hl*dt);continue;
    }
    if(t.k==='web'){
      for(const e of S.en)if(!e.dead&&!e.bur&&hyp(e.x,e.y,t.x,t.y)<=s.r){e.sl=.2;e.sf=s.sl;}
      t.wt=(t.wt||0)+dt;
      if(t.wt>=4){t.wt=0;if(s.x.has('stun'))for(const e of S.en)if(!e.dead&&!e.bur&&hyp(e.x,e.y,t.x,t.y)<=s.r)e.rf=Math.max(e.rf,.6);}
      continue;
    }
    if(t.cd>0)continue;
    const tg=nearE(t.x,t.y,s.r);if(!tg)continue;
    t.cd=s.cd*(t.bf>1?1/t.bf:1);
    if(t.k==='spore'){
      hit(tg,s.dmg*t.bd,t);S.fx.push({k:'beam',x1:t.x,y1:t.y-.3,x2:tg.x,y2:tg.y,t:.15,c:'#c8a0ff'});
      if(s.x.has('pierce')){let o=null,od=s.r;for(const e of S.en){if(e===tg||e.dead||(e.bur&&e.rv<=0))continue;const d=hyp(e.x,e.y,t.x,t.y);if(d<=od){od=d;o=e;}}if(o)hit(o,s.dmg*t.bd,t);}
    }
    else if(t.k==='root'){hit(tg,s.dmg*t.bd,t);tg.rf=Math.max(tg.rf,s.rt);}
    else if(t.k==='puff')S.pr.push({k:'s',x0:t.x,y0:t.y,x1:tg.x,y1:tg.y,t:0,dur:.7,dmg:s.dmg*t.bd,ar:s.ar,tox:s.x.has('toxic')});
  }
  for(const p of S.pr){
    p.t+=dt;
    if(p.k==='s'&&p.t>=p.dur){
      for(const e of S.en)if(!e.dead&&(!e.bur||e.rv>0)&&hyp(e.x,e.y,p.x1,p.y1)<=p.ar){hit(e,p.dmg,null);if(p.tox)e.tox=3;}
      S.fx.push({k:'ring',x:p.x1,y:p.y1,r:p.ar,t:.45,T:.45,c:'255,179,107'});p.done=1;
    }
    if(p.k==='f'){const tg=p.tg;if(!tg||tg.hp<=0){p.done=1;continue;}const dd=hyp(p.x,p.y,tg.x,tg.y),sp=5*dt;if(dd<=sp){tg.hp-=p.dmg;p.done=1;burst(tg.x,tg.y,'#7fe0b8',6);}else{p.x+=(tg.x-p.x)/dd*sp;p.y+=(tg.y-p.y)/dd*sp;}}
  }
  S.pr=S.pr.filter(p=>!p.done);
  for(const f of S.fx){f.t-=dt;if(f.k==='p'){f.ox+=f.vx*dt;f.oy+=f.vy*dt;f.vy+=260*dt;}}
  S.fx=S.fx.filter(f=>f.t>0);
  S.en=S.en.filter(e=>!e.dead);
  for(const t of S.tw)if(t.hp<=0)burst(t.x,t.y,'#ff8a7a',14);
  S.tw=S.tw.filter(t=>t.hp>0);
  S.tr=S.tr.filter(t=>t.hp>0);
  if(S.sel&&!S.tw.includes(S.sel))S.sel=null;
  if(S.nest.hp<=0&&!S.over&&!STAGES[stage].boss)S.over='won';
  if(STAGES[stage].boss&&S.w>=MAXW&&idle&&!S.over)S.over='won';
  if(S.hp<=0&&!S.over)S.over='lost';
}
function nearT(e,r){let b=null,bd=r;for(const t of [...S.tr,...S.tw]){if(t.hp<=0)continue;const d=hyp(e.x,e.y,t.x,t.y);if(d<=bd){bd=d;b=t;}}return b;}

const ad=(a,b)=>{const d=Math.abs(a-b)%360;return d>180?360-d:d;};
function pick(list,o,n,ang){let b=o,bd=999;for(let i=o;i<o+n;i++){const d=ad(list[i],ang);if(d<bd){bd=d;b=i;}}return[b,(ang-list[b])*Math.PI/180];}
function drawSpr(img,idx,rot,x,y,s){g.save();g.translate(x,y);g.rotate(rot);g.drawImage(img,idx*64,0,64,64,-s/2,-s/2,s,s);g.restore();}
function shadow(x,y,w,h){g.fillStyle='rgba(0,0,0,.35)';g.beginPath();g.ellipse(x,y,w,h,0,0,7);g.fill();}
function hpBar(x,y,w,r,c='#7fe0b8'){g.fillStyle='#1b1f22';g.fillRect(x-w/2,y,w,3);g.fillStyle=r>.5?c:'#ff8a7a';g.fillRect(x-w/2,y,w*Math.max(0,Math.min(1,r)),3);}
function ring(x,y,r,col,a){g.strokeStyle=`rgba(${col},${a})`;g.lineWidth=2;g.beginPath();g.ellipse(x,y,r*56.6,r*28.3,0,0,7);g.stroke();}

function drawTower(t){
  const[x,y]=P(t.x,t.y),p=.5+.5*Math.sin(t.ph*2.4),s=st(t);
  g.drawImage(IM.tw,TK.indexOf(t.k)*64,0,64,64,x-32,y-50,64,64);
  if(t.k==='glow'||t.k==='puff'||t.k==='mend'){const col={glow:'127,245,224',puff:'217,200,255',mend:'143,227,176'}[t.k];const gr=g.createRadialGradient(x,y-20,6,x,y-20,38);gr.addColorStop(0,`rgba(${col},${.25+.2*p})`);gr.addColorStop(1,`rgba(${col},0)`);g.fillStyle=gr;g.beginPath();g.arc(x,y-20,38,0,7);g.fill();}
  for(let i=0;i<t.lv;i++){g.fillStyle=i<3?'#ffe08a':'#9fffe6';g.beginPath();g.arc(x-6+i*6,y-58,2.5,0,7);g.fill();}
  if(t.hp<t.max)hpBar(x,y-64,26,t.hp/t.max);
}
function drawEn(e){
  const[x,y]=P(e.x,e.y),T=EN[e.k];
  if(e.bur&&!(e.rv>0)){g.strokeStyle='rgba(159,255,230,.7)';g.lineWidth=1.5;for(let i=0;i<2;i++){const k=(e.ph/6+i/2)%1;g.globalAlpha=1-k;g.beginPath();g.ellipse(x,y,6+k*18,3+k*9,0,0,7);g.stroke();}g.globalAlpha=1;return;}
  const p0=at(e.d),p1=at(e.d+.2);
  const ang=e.k==='worm'?e.hd:sA(p1[0]-p0[0],p1[1]-p0[1]);
  const[idx,rot]=pick(HE,T.o,T.n,deg(ang));
  const s=(e.k==='worm'?50:56)*T.s;
  shadow(x,y+2,s*.35,s*.16);
  g.globalAlpha=e.fl>0?.6:1;drawSpr(IM.en,idx,rot,x,y-s*.3+Math.sin(e.ph)*1.2,s);g.globalAlpha=1;
  if(e.hp<e.max)hpBar(x,y-s*.6-4,22,e.hp/e.max);
  if(e.sh>0)hpBar(x,y-s*.6-9,22,e.sh/e.shm,'#e8d8a0');
}
function drawTr(t){
  const[x,y]=P(t.x,t.y),T=TR[t.k];
  const p0=at(t.d),p1=at(Math.max(0,t.d-.2)),ang=sA(p1[0]-p0[0],p1[1]-p0[1]);
  if(t.k==='ant'){
    shadow(x,y+2,9,5);
    g.save();g.translate(x,y-4);g.rotate(ang);
    g.strokeStyle='#2a1a10';g.lineWidth=1.3;
    for(let i=-1;i<=1;i++)for(const s of[-1,1]){const o=Math.sin(t.ph+i)*3;g.beginPath();g.moveTo(i*4,s*2);g.lineTo(i*4+o,s*8);g.stroke();}
    g.fillStyle=t.fl>0?'#fff':'#8a4a2a';g.beginPath();g.ellipse(-5,0,5,4,0,0,7);g.ellipse(2,0,4,3.5,0,0,7);g.ellipse(8,0,4,4,0,0,7);g.fill();
    g.restore();
  }else{
    const[idx,rot]=pick(HF,T.o,T.n,deg(ang));
    const bob=t.k==='fly'?-12+Math.sin(t.ph*3)*3:-6+Math.sin(t.ph)*1.5;
    shadow(x,y+2,11,6);
    g.globalAlpha=t.fl>0?.6:1;drawSpr(IM.fr,idx,rot,x,y+bob-6,48);g.globalAlpha=1;
  }
  if(t.hp<t.max)hpBar(x,y-30,22,t.hp/t.max);
}
function drawCic(){
  const c=S.cic,[x,y]=P(c.x,c.y),[idx,rot]=pick(HF,TR.cicada.o,TR.cicada.n,deg(c.hd)),b=Math.sin(c.ph)*1.5;
  shadow(x,y+2,11,6);
  drawSpr(IM.fr,idx,rot,x,y-14+b,50);
  if(c.m==='strike')ring(x,y,.35,'255,224,138',.9);
  hpBar(x,y-34,22,c.hp/60);
}
function drawBase(){
  const[x,y]=P(BASE[0],BASE[1]),p=.5+.5*Math.sin(S.t*2);
  const gr=g.createRadialGradient(x,y-30,30,x,y-30,120);gr.addColorStop(0,`rgba(90,255,230,${.18+.1*p})`);gr.addColorStop(1,'rgba(90,255,230,0)');g.fillStyle=gr;g.beginPath();g.arc(x,y-30,120,0,7);g.fill();
  g.drawImage(IM.bs,0,0,128,128,x-64,y-96,128,128);
  hpBar(x,y-104,80,S.hp/20);
}
function drawNest(){
  const[x,y]=P(NEST[0],NEST[1]),p=.5+.5*Math.sin(S.t*3);
  shadow(x,y+4,46,20);
  g.drawImage(IM.nest,0,0,96,96,x-48,y-66,96,96);
  g.strokeStyle=`rgba(255,138,122,${.3+.3*p})`;g.lineWidth=2;g.beginPath();g.ellipse(x,y+8,44,22,0,0,7);g.stroke();
  g.fillStyle='#ffb8a8';g.font='bold 11px system-ui';g.textAlign='center';g.fillText('ENEMY BURROW',x,y-72);g.textAlign='left';
  hpBar(x,y-68,80,S.nest.hp/S.nest.max,'#ff8a7a');
}
function drawProj(p){
  if(p.k==='s'){
    const k=Math.min(1,p.t/p.dur),[ax,ay]=P(p.x0,p.y0),[bx,by]=P(p.x1,p.y1);
    const x=ax+(bx-ax)*k,y=ay+(by-ay)*k,lift=Math.sin(k*Math.PI)*26;
    g.fillStyle='rgba(0,0,0,.3)';g.beginPath();g.ellipse(x,y,5,3,0,0,7);g.fill();
    g.fillStyle='#e3c6ff';g.beginPath();g.arc(x,y-lift,6,0,7);g.fill();
  }else{const[x,y]=P(p.x,p.y);g.fillStyle='#7fe0b8';g.beginPath();g.arc(x,y,4,0,7);g.fill();}
}
function drawFx(f){
  g.globalAlpha=Math.max(0,Math.min(1,f.t*2.5));
  if(f.k==='beam'){const[a,b]=P(f.x1,f.y1),[c,d]=P(f.x2,f.y2);g.strokeStyle=f.c;g.lineWidth=2;g.beginPath();g.moveTo(a,b);g.lineTo(c,d);g.stroke();}
  else if(f.k==='slime'){const[x,y]=P(f.x,f.y);g.fillStyle='rgba(120,230,170,.35)';g.beginPath();g.ellipse(x,y,22,11,0,0,7);g.fill();}
  else if(f.k==='ring'){const[x,y]=P(f.x,f.y),k=1-f.t/f.T,r=f.r*(.4+.6*k);g.globalAlpha=f.t/f.T;g.strokeStyle=`rgba(${f.c},1)`;g.lineWidth=3;g.beginPath();g.ellipse(x,y,r*56.6,r*28.3,0,0,7);g.stroke();g.fillStyle=`rgba(${f.c},.15)`;g.fill();}
  else{const[x,y]=P(f.x,f.y);g.fillStyle=`rgba(${f.c||'255,255,255'},1)`;g.fillStyle=f.c&&f.c.startsWith('#')?f.c:g.fillStyle;g.fillRect(x+f.ox,y+f.oy,3,3);}
  g.globalAlpha=1;
}

function render(){
  g.clearRect(0,0,C.width,C.height);g.drawImage(GR,0,0);
  const H=S.hov;
  const focus=S.bld?null:(S.sel||null);
  for(const gt of S.tw)if(gt.k==='glow'&&(gt===focus||(H&&gt.x===H[0]&&gt.y===H[1]))){
    const s=st(gt);ring(...P(gt.x,gt.y),s.r,'127,245,224',.5);
    for(const t of S.tw)if(t!==gt&&hyp(t.x,t.y,gt.x,gt.y)<=s.r){const[a,b]=P(gt.x,gt.y),[c,d]=P(t.x,t.y);g.strokeStyle='rgba(127,245,224,.6)';g.setLineDash([4,4]);g.lineWidth=1.5;g.beginPath();g.moveTo(a,b-18);g.lineTo(c,d-30);g.stroke();g.setLineDash([]);g.fillStyle='#9fffe6';g.font='bold 11px system-ui';g.fillText('+'+Math.round(gt.bf>1?s.bo*100:s.bo*100)+'%',c+8,d-34);}
  }
  if(S.bld&&H&&H[0]>=0&&H[1]>=0&&H[0]<GW&&H[1]<GH){
    const[x,y]=P(H[0],H[1]);
    g.fillStyle=canB(H[0],H[1])?'rgba(120,255,200,.35)':'rgba(255,100,90,.35)';dia(g,x,y);g.fill();
    ring(x,y,TD[S.bld].r,'159,255,230',.6);
    if(S.bld==='puff'){ring(x,y,TD[S.bld].ar,'255,179,107',.9);}
  }
  if(!S.bld&&H&&H[0]>=0&&H[1]>=0&&H[0]<GW&&H[1]<GH){const[x,y]=P(H[0],H[1]);g.fillStyle='rgba(255,255,255,.08)';dia(g,x,y);g.fill();}
  if(focus){const[x,y]=P(focus.x,focus.y),s=st(focus);ring(x,y,s.r,'159,255,230',.8);if(focus.k==='puff')ring(x,y,s.ar,'255,179,107',.9);}
  const L=[];
  for(const t of S.tw)L.push([t.x+t.y,()=>drawTower(t)]);
  for(const e of S.en)L.push([e.x+e.y,()=>drawEn(e)]);
  for(const t of S.tr)L.push([t.x+t.y,()=>drawTr(t)]);
  if(S.cic)L.push([S.cic.x+S.cic.y,drawCic]);
  L.push([BASE[0]+BASE[1],drawBase]);
  L.push([NEST[0]+NEST[1],drawNest]);
  L.sort((a,b)=>a[0]-b[0]);for(const o of L)o[1]();
  for(const p of S.pr)drawProj(p);
  for(const f of S.fx)drawFx(f);
  {const bo=S.en.find(e=>e.k==='boss');if(bo&&!bo.dead){const w=460,x=C.width/2-w/2;g.fillStyle='rgba(0,0,0,.55)';g.fillRect(x-8,6,w+16,48);g.fillStyle='#ffb8a8';g.font='bold 13px system-ui';g.textAlign='center';g.fillText('SHELL COLOSSUS: Giant Snail',C.width/2,22);g.textAlign='left';g.fillStyle='#1b1f22';g.fillRect(x,28,w,8);g.fillStyle='#7fe0b8';g.fillRect(x,28,w*Math.max(0,bo.hp/bo.max),8);g.fillStyle='#1b1f22';g.fillRect(x,40,w,6);g.fillStyle='#e8d8a0';g.fillRect(x,40,w*Math.max(0,bo.sh/bo.shm),6);}}
  if(S.over){
    g.fillStyle='rgba(0,0,0,.65)';g.fillRect(0,0,C.width,C.height);g.fillStyle='#cfeee8';g.textAlign='center';
    g.font='30px system-ui';g.fillText(S.over==='won'?(STAGES[stage].boss?'The Shell Colossus has fallen.':'The Enemy Burrow is destroyed.')+' The mycelium wins.':'The Mycelium Base has been overrun',C.width/2,C.height/2-6);
    g.font='15px system-ui';g.fillText((S.over==='won'&&stage+1<STAGES.length?'Click for next stage':S.over==='won'?'Click to replay':'Click to retry'),C.width/2,C.height/2+24);g.textAlign='left';
  }
}

let lastPz=null;
function hud(){
 $('sp').textContent=Math.floor(S.sp);
 $('hp').textContent=Math.max(0,S.hp);$('hb').style.width=Math.max(0,S.hp)*5+'%';
 $('nh').textContent=Math.ceil(Math.max(0,S.nest.hp));$('nb').style.width=Math.max(0,S.nest.hp/S.nest.max*100)+'%';
 $('wv').textContent=S.w+'/'+MAXW;
 $('msg').style.opacity=S.ml>0?1:0;
 const idle=!S.q.length&&!S.en.length,cb=$('call');
 cb.classList.toggle('no',!idle||S.w>=MAXW||!!S.over);
 cb.bd.t.textContent=idle?Math.floor(S.nx):'-';
 $('spd').lbl.textContent='x'+S.spd;
 if(lastPz!==S.pz){lastPz=S.pz;$('pz').replaceChildren(icn(IM.ui,UI[S.pz?'play':'pause'],22));}
 for(const k of TK){const b=$('b_'+k);b.classList.toggle('on',S.bld===k);b.classList.toggle('no',S.sp<TD[k].c||!!S.over);}
 for(const k of RK){
  const T=TR[k],b=$('r_'+k),cool=S.cdt[k]>0,busy=!!T.lim&&(k==='cicada'?!!S.cic:S.tr.some(t=>t.k===k));
  b.classList.toggle('no',S.sp<T.c||cool||busy||!!S.over);
  b.cd.textContent=cool?Math.ceil(S.cdt[k]):'';
  b.dot.className='dot'+(k==='cicada'&&S.cic?' '+S.cic.m:busy?' busy':' idle');
 }
 STAGES.forEach((s,i)=>{const b=$('s'+i);b.classList.toggle('on',i===stage);b.classList.toggle('locked',i>=UNL);});
}
function showSel(){
 const el=$('sel');
 if(!S.sel){if(SELK!==null){el.innerHTML='<div class="dim">Click a tower to upgrade or sell it</div>';SELK=null;}return;}
 const t=S.sel,T=TD[t.k],s=st(t);
 if(SELK!==t||SELLV!==t.lv){
  SELK=t;SELLV=t.lv;el.innerHTML='';
  const top=document.createElement('div');top.className='seltop';top.appendChild(icn(IM.tw,TK.indexOf(t.k),56));
  const info=document.createElement('div');const h=document.createElement('b');h.textContent=T.nm;info.appendChild(h);
  const pips=document.createElement('div');pips.className='pips';for(let i=0;i<3;i++){const p=document.createElement('i');if(i<t.lv)p.className='on';pips.appendChild(p);}info.appendChild(pips);
  const hm=document.createElement('div');hm.className='meter sm';hm.style.width='100%';hm.appendChild(document.createElement('i'));info.appendChild(hm);
  top.appendChild(info);el.appendChild(top);
  const chips=document.createElement('div');chips.className='chips';
  const add=(ic,val,tt)=>{const c=document.createElement('span');c.className='chip';c.appendChild(icn(IM.ui,ic,18));const v=document.createElement('b');v.textContent=val;c.appendChild(v);tipOn(c,tt[0],tt[1]);chips.appendChild(c);};
  if(t.k==='glow'){add(UI.target,s.r.toFixed(1),['Light radius','Towers inside get the boost']);add(UI.bolt,'+'+Math.round(s.bo*100)+'%',['Boost','Added to damage and fire rate']);}
  else if(t.k==='web'){add(UI.target,s.r.toFixed(1),['Zone radius','Enemies inside slow down']);add(UI.clock,Math.round(s.sl*100)+'%',['Speed in zone','Lower is slower']);}
  else if(t.k==='mend'){add(UI.target,s.r.toFixed(1),['Heal radius','Heals troops and other menders']);add(UI.bolt,s.hl.toFixed(1)+'/s',['Heal rate','Per troop in range']);}
  else{add(UI.sword,s.dmg.toFixed(1),['Damage','Per hit']);add(UI.clock,s.cd.toFixed(2)+'s',['Fire rate','Seconds between shots']);add(UI.target,s.r.toFixed(1),['Range','In tiles']);if(t.k==='puff')add(UI.bolt,s.ar.toFixed(1),['Blast radius','Shown as an orange ring']);}
  el.appendChild(chips);
  if(s.x.size){const tags=document.createElement('div');tags.className='chips';for(const x of s.x){const c=document.createElement('span');c.className='tag';c.textContent=x;tags.appendChild(c);}el.appendChild(tags);}
  const row=document.createElement('div');row.className='acts';
  if(t.lv<3){
   const u=T.u[t.lv],ub=document.createElement('button');ub.className='ib ubtn';ub.appendChild(icn(IM.ui,UI.up,30));const bd=mkBadge();bd.t.textContent=u.c;ub.appendChild(bd);
   tipOn(ub,`Upgrade to level ${t.lv+1} (${u.c} spores)`,u.t);
   ub.onclick=()=>{if(S.sp<u.c){say('Need '+u.c+' spores to upgrade.');return;}S.sp-=u.c;t.spent+=u.c;t.lv++;say(T.nm+' is now level '+t.lv+'.');SELK=null;showSel();};
   row.appendChild(ub);
  }
  const sb=document.createElement('button');sb.className='ib sbtn';sb.appendChild(icn(IM.ui,UI.sell,30));const sbd=mkBadge();sbd.t.textContent=Math.floor(t.spent*.6);sb.appendChild(sbd);
  tipOn(sb,'Sell tower','Refunds 60% of the spores spent on it');
  sb.onclick=()=>{S.sp+=Math.floor(t.spent*.6);t.hp=0;S.sel=null;SELK=null;say('Tower sold.');showSel();};
  row.appendChild(sb);el.appendChild(row);
 }
 const bar=el.querySelector('.meter.sm i');if(bar)bar.style.width=Math.max(0,t.hp/t.max*100)+'%';
}
const UI={coin:0,heart:1,burrow:2,wave:3,play:4,ff:5,pause:6,sell:7,up:8,map:9,ant:10,clock:11,sword:12,bolt:13,target:14,lock:15};
function icn(img,idx,size){const c=document.createElement('canvas');c.width=c.height=size;c.getContext('2d').drawImage(img,idx*64,0,64,64,0,0,size,size);return c;}
function mkBadge(){const s=document.createElement('span');s.className='badge';s.appendChild(icn(IM.ui,UI.coin,13));s.t=document.createElement('span');s.appendChild(s.t);return s;}
const tipEl=$('tip');
function tipOn(el,title,body){
  el.addEventListener('mouseenter',()=>{tipEl.innerHTML='';const a=document.createElement('b');a.textContent=title;tipEl.appendChild(a);if(body){const p=document.createElement('div');p.className='dim';p.textContent=body;tipEl.appendChild(p);}tipEl.style.display='block';});
  el.addEventListener('mousemove',e=>{tipEl.style.left=Math.min(innerWidth-270,e.clientX+14)+'px';tipEl.style.top=(e.clientY+16)+'px';});
  el.addEventListener('mouseleave',()=>{tipEl.style.display='none';});
}
function buildUI(){
  $('i-coin').appendChild(icn(IM.ui,UI.coin,22));$('i-hp').appendChild(icn(IM.ui,UI.heart,22));$('i-nest').appendChild(icn(IM.ui,UI.burrow,22));$('i-wave').appendChild(icn(IM.ui,UI.wave,20));
  const cb=$('call');cb.appendChild(icn(IM.ui,UI.play,22));cb.bd=mkBadge();cb.appendChild(cb.bd);
  tipOn(cb,'Call next wave','Bonus spores equal the seconds you skip.');
  cb.onclick=()=>{if(!S.q.length&&!S.en.length&&S.w<MAXW&&!S.over){S.sp+=Math.floor(S.nx);callWave();}else say('A wave is already coming.');};
  const sp=$('spd');sp.lbl=document.createElement('span');sp.lbl.className='lbl';sp.append(icn(IM.ui,UI.ff,22),sp.lbl);
  tipOn(sp,'Game speed','Click to cycle 1x, 2x, 3x.');sp.onclick=()=>{S.spd=S.spd%3+1;};
  const pz=$('pz');pz.appendChild(icn(IM.ui,UI.pause,22));tipOn(pz,'Pause','Space also pauses.');pz.onclick=()=>{S.pz=!S.pz;};
  for(const k of TK){
    const T=TD[k],b=document.createElement('button');b.id='b_'+k;b.className='ib tcard';
    b.appendChild(icn(IM.tw,TK.indexOf(k),52));const bd=mkBadge();bd.t.textContent=T.c;b.appendChild(bd);
    tipOn(b,`${T.nm} · ${T.c} spores`,T.ds);
    b.onclick=()=>{S.bld=k;S.sel=null;SELK=null;say('Click open ground beside the track to place it.');};
    $('tw').appendChild(b);
  }
  for(const k of RK){
    const T=TR[k],b=document.createElement('button');b.id='r_'+k;b.className='ib rcard';
    b.appendChild(k==='ant'?icn(IM.ui,UI.ant,46):icn(IM.fr,T.o,46));
    const bd=mkBadge();bd.t.textContent=T.c;b.appendChild(bd);
    b.cd=document.createElement('span');b.cd.className='cd';b.appendChild(b.cd);
    b.dot=document.createElement('i');b.dot.className='dot';b.appendChild(b.dot);
    tipOn(b,`${T.nm} · ${T.c} spores`,T.ds+' Marches to the Enemy Burrow.');
    b.onclick=()=>deploy(k);
    $('tr').appendChild(b);
  }
  STAGES.forEach((s,i)=>{
    const b=document.createElement('button');b.id='s'+i;b.className='ib scard';
    b.appendChild(icn(IM.ui,UI.map,46));
    const n=document.createElement('span');n.className='num';n.textContent=i+1;b.appendChild(n);
    const lk=icn(IM.ui,UI.lock,22);lk.className='lk';b.appendChild(lk);
    tipOn(b,s.nm,'Locked until the previous stage is cleared.');
    b.onclick=()=>{if(i<UNL)startStage(i);else say('Clear the previous stage first.');};
    $('stg').appendChild(b);
  });
  C.addEventListener('mousemove',e=>{S.hov=toGrid(e);});
  C.addEventListener('mouseleave',()=>{S.hov=null;});
  C.addEventListener('contextmenu',e=>{e.preventDefault();S.bld=null;S.sel=null;SELK=null;});
  C.addEventListener('click',e=>{
    if(S.over){if(S.over==='won'){UNL=Math.max(UNL,Math.min(stage+2,STAGES.length));save();if(stage+1<STAGES.length){startStage(stage+1);return;}}startStage(stage);return;}
    const[x,y]=toGrid(e);
    const tw=S.tw.find(t=>t.x===x&&t.y===y);
    if(tw){S.sel=tw;S.bld=null;showSel();return;}
    if(!S.bld){S.sel=null;showSel();return;}
    if(!canB(x,y)){say('Build beside the track on open ground.');return;}
    const c=TD[S.bld].c;if(S.sp<c){say('Need '+c+' spores.');return;}
    S.sp-=c;S.tw.push({k:S.bld,x,y,lv:0,spent:c,hp:TD[S.bld].hp,max:TD[S.bld].hp,cd:0,bf:1,bd:1,ph:Math.random()*6});
    say(TD[S.bld].nm+' planted. Click it to upgrade.');
  });
  document.addEventListener('keydown',e=>{
    const n=parseInt(e.key,10);
    if(n>=1&&n<=6){S.bld=TK[n-1];S.sel=null;}
    else if(e.key===' '){e.preventDefault();S.pz=!S.pz;}
    else if(e.key==='Escape'){S.bld=null;S.sel=null;SELK=null;}
  });
}
function loop(now){
  const dt=Math.min(.1,(now-last)/1000);last=now;
  if(!S.pz&&!S.over)for(let i=0;i<4;i++)update(dt*S.spd/4);
  if((S.it+=dt)>.25){S.it=0;showSel();}
  render();hud();
  requestAnimationFrame(loop);
}
</script></body></html>
